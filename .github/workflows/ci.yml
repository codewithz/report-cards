name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install PHP 8.4 (same as the lab PCs)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer packages
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Make a .env file and an app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        run: php artisan test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new admin@"$DEPLOY_HOST" '
            set -e
            cd /var/www/report-cards
            echo "Before:"; git branch -vv; git log --oneline -1
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            echo "Now running:"; git log --oneline -1
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
          '